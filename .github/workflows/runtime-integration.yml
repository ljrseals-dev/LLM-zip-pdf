name: runtime-integration
on:
  push:
    branches:
      - "repair/document-pipeline-hardening"
      - "repair/runtime-integration-ci"
    paths:
      - ".github/workflows/runtime-integration.yml"
      - "scripts/runtime_smoke.py"
      - "src/**"
      - "prompts/**"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/runtime-integration.yml"
      - "scripts/runtime_smoke.py"
      - "src/**"
      - "prompts/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-gguf-and-gradio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU inference runtime
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
          FORCE_CMAKE: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu "llama-cpp-python==0.3.16"
      - name: Install application and Gradio client dependencies
        run: |
          python -m pip install "huggingface_hub<1" "pypdf>=4.0.0" "fastapi==0.115.2" "starlette==0.40.0" "pydantic==2.9.2" "gradio==4.44.1" "gradio_client==1.3.0" "requests>=2.31"
      - name: Download pinned small public GGUF model
        run: |
          mkdir -p models
          curl --fail --location --retry 3 --retry-all-errors \
            "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf" \
            --output models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
          echo "6eb923e7d26e9cea28811e1a8e852009b21242fb157b26149d3b188f3a8c8653  models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf" | sha256sum --check
      - name: Run real inference and live Gradio upload test
        env:
          LLM_ZIP_PDF_MODEL: models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
          GRADIO_ANALYTICS_ENABLED: "False"
        run: python scripts/runtime_smoke.py
